services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: error_inbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d error_inbox"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - error-inbox-postgres:/var/lib/postgresql/data

volumes:
  error-inbox-postgres:
